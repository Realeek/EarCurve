[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earcurve"
version = "0.1.0"
description = "A dedicated EQ companion for the DARKRIM (CunYuan YingShi) headphone driver."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PySide6-Essentials>=6.6",
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
]

[project.scripts]
earcurve = "earcurve.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
